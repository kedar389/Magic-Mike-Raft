plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = 'com.rendertweaks'
archivesBaseName = project.mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // Embeddium's vertex writer API, for the Lionfish fast path. Copy the jar from the client
    // instance's mods/ into ./libs/ before building (libs/*.jar is gitignored).
    // Not deobfuscated: only the vertex API is used, which names no Minecraft members.
    compileOnly files('libs/embeddium-0.3.31+mc1.20.1.jar')

    // MixinSquared's @TargetHandler, for patching Apoli's own render mixin. Not bundled: several mods
    // in the pack already ship it (Medieval Origins, AsyncParticles). Copy
    // META-INF/jars/MixinSquared-0.3.7-beta.3.jar out of the jar-in-jar
    // META-INF/jarjar/mixinsquared-forge-0.3.7-beta.3.jar inside medievalorigins into ./libs/.
    compileOnly files('libs/MixinSquared-0.3.7-beta.3.jar')

    // Bagus Lib's event types, for the pose-reset tweak. Copy bagus_lib-1.20.1-5.6.1.jar from the
    // client instance's mods/ into ./libs/. Only its own method names are called, so no deobf needed.
    compileOnly files('libs/bagus_lib-1.20.1-5.6.1.jar')

    // Pehkui's API types, for the default-scale shortcut. Copy Pehkui-3.8.2+1.20.1-forge.jar from the
    // client instance's mods/ into ./libs/. Only Pehkui's own method names are called.
    compileOnly files('libs/Pehkui-3.8.2+1.20.1-forge.jar')
    // Lionfish API, Chloride, KnightLib and Apoli are not compile deps: their classes are targeted by name
    // and Lionfish's package-private model data is read by reflection.
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'render_tweaks',
            'Specification-Vendor'   : 'render_tweaks',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'render_tweaks',
            // Forge 1.20.1 registers mixin configs from this attribute, not from mods.toml.
            // Second config is optional (required: false): the Apoli power index patches an interface,
            // and if it cannot apply, Apoli runs unpatched instead of the game failing to start.
            'MixinConfigs'           : 'render_tweaks.mixins.json,render_tweaks.apoli.mixins.json',
        ])
    }
}

modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

# Cataclysm's CuriosItem posts CurioAttributeModifierEvent but returns its own map, so no listener
# can reach its curios. The mixin is the only way in. Skipped entirely by
# AttributeMergeMixinPlugin when Cataclysm is absent.
#
# The config is registered by the MixinConfigs manifest attribute set in build.gradle, NOT by this
# block: Forge 1.20.1 parses [[mixins]] and then never passes it to Mixin. Kept because it is the
# declaration newer loaders read, and it is inert here.
[[mixins]]
    config="attribute_merge.mixins.json"

[[mods]]
    modId="attribute_merge"
    version="0.1.0"
    displayName="Attribute Merge"
    description='''
Folds duplicate RPG attributes into the Apothic Attributes set. Rewrites item attribute modifiers
for Cataclysm's, Obscure API's and Additional Entity Attributes' duplicate stats onto their Apothic
equivalents, rescaling the amount (Cataclysm counts percent points) and forcing ADDITION (Obscure
delivers MULTIPLY_BASE but reads it additively). A mixin also repairs Cataclysm's curios, which
discard event listener output, and aliases the ring slot so Ring of the Grudge works after the
pack's slot reroute. On the client, curio attribute lines are re-rendered through Apothic's
formatter, which Curios does not use, so a curio shows +10% where it used to show +0.1.
Event-driven: nothing ticks. The seven Iron's Lib duplicates are handled separately by the
Attribute_Merge datapack.
'''

[[dependencies.attribute_merge]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.attribute_merge]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# All three are optional: the mod resolves attributes by id at runtime and simply no-ops for any
# family that isn't present. Ordering AFTER so their attributes are registered before we resolve.
[[dependencies.attribute_merge]]
    modId="attributeslib"
    mandatory=false
    versionRange="[1.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.attribute_merge]]
    modId="cataclysm"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.attribute_merge]]
    modId="obscure_api"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

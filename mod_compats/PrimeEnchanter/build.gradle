plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = 'com.primeenchanter'
archivesBaseName = project.mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            mods { prime_enchanter { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // Copied out of the live mods folder (gitignored), same jar as IronsCompanions/libs.
    implementation fg.deobf(files('libs/geckolib-forge-1.20.1-4.8.4.jar'))
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'prime_enchanter',
            'Specification-Vendor'   : 'prime_enchanter',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'prime_enchanter',
        ])
    }
}

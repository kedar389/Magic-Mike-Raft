[[mods]]
    modId="irons_companions"
    version="0.1.0"
    displayName="Iron's Companions"
    description='''
Compatibility + content bridge between Iron's Spells 'n Spellbooks and the Companions! mod.
Converts Companions' magic-book effects into real Iron's Spells (scroll + spellbook castable),
retypes companion ability damage to the correct magic schools, and adds armour/ally bridges.
'''


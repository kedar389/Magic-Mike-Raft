plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'checkstyle'
    id 'net.ltgt.errorprone' version '5.1.0'
}

version = project.mod_version
group = 'com.ironscompanions'
archivesBaseName = project.mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // Official (Mojang) mappings, same as the OriginSpellSchools sibling mod.
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { irons_companions { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { irons_companions { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    // GeckoLib / Curios mavens (needed at runtime for Companions to load in dev):
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.blamejared.com' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // --- Iron's Spells 'n Spellbooks 3.16.2 (compile API) ---
    implementation fg.deobf('curse.maven:irons-spells-855414:8364933')

    // --- Companions + GTBC libs: deobf'd from the local jars in ./libs/ ---------------
    // Copy these out of `servers_folder/magic server/mods/` into `mod_compats/IronsCompanions/libs/`
    // before building. CurseMaven file IDs unknown -> local jars keep the build reproducible.
    //
    // Companions is a compile dep: we name its projectile entities, its Soul Mage, its Soul Furnace
    // recipe and its loot blocks.
    implementation fg.deobf(files('libs/companions-forge-1.20.1-1.2.3.jar'))
    // The GTBC pair is runtime-only: nothing here imports them. Geomancy Plus is reached purely by id
    // (`gtbcs_geomancy_plus:geo`, the school Stone Spikes casts in), so it just has to be loaded, and
    // spell_lib comes along as its own dependency. Both stay mandatory in mods.toml, because that
    // school has to exist when the spell is built.
    runtimeOnly fg.deobf(files('libs/gtbcs_spell_lib-1.5.0-1.20.1.jar'))
    runtimeOnly fg.deobf(files('libs/gtbcs_geomancy_plus-2.0.0-1.20.1.jar'))

    // --- JEI (optional, client): API only, for the book-hiding plugin -----------------
    // Version matches the installed jei-1.20.1-forge-15.20.0.112.jar. From maven.blamejared.com.
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.112')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.112')
    runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.112')

    // GeckoLib and KnightLib are compile deps, not runtime-only: Companions entities (the Soul Mage)
    // implement GeoEntity, so javac needs them to resolve the class hierarchy we touch.
    implementation fg.deobf(files('libs/geckolib-forge-1.20.1-4.8.4.jar'))
    implementation fg.deobf(files('libs/knightlib-forge-1.20.1-1.6.1.jar'))

    // Pinned to 2.42.0 (last release that runs on JDK 17; 2.43+ needs JDK 21).
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    // Curios: a runtime dep for Companions, and a compile dep for us since
    // event/NaginataBookAttributes listens on CurioAttributeModifierEvent.
    implementation fg.deobf(files('libs/curios-forge-5.14.1+1.20.1.jar'))
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'irons_companions',
            'Specification-Vendor'   : 'irons_companions',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'irons_companions',
            // This is what actually registers the mixin config on Forge 1.20.1. A [[mixins]] block in
            // mods.toml parses and is then never handed to Mixin, with no error logged. Same approach
            // as the AttributeMerge sibling.
            'MixinConfigs'           : 'irons_companions.mixins.json',
        ])
    }
}

// ---- Quality tooling ----------------------------------------------------------
// Mirrors mod_compats/OriginSpellSchools, minus Spotless's palantirJavaFormat: adopting that here
// would reformat all 33 sources wholesale and bury real diffs. The checks below catch bugs, not layout.

checkstyle {
    toolVersion = '12.3.1'   // 13.x requires a JDK 21 daemon; 12.3.1 is the latest for Java 17
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // Minecraft compares entities and items by identity throughout, and Entity#equals compares by
        // network id, which would be the surprising choice here rather than the safe one.
        disable "ReferenceEquality"
    }
}

general {
    # If the Attributes GUI is available.
    # Default: true
    B:"Enable Attributes GUI"=true

    # If description tooltips will be added to potion items.
    # Default: true
    B:"Enable Potion Tooltips"=true

    # A list of attributes that will be hidden from the Attributes GUI.
    # Default: [forge:nametag_distance], [attributeslib:creative_flight], [attributeslib:elytra_flight], [attributeslib:ghost_health]
    #
    # CUSTOMIZED: the duplicate attributes we merge into the Apothic ones are hidden here, so each
    # stat shows exactly ONE row. Merging moves the VALUES (see datapacks/Attribute_Merge/ and
    # mod_compats/AttributeMerge/); it does not unregister the attributes, so without this list
    # their now-always-base rows still show up in the GUI.
    #
    #   irons_lib:*  , fork of the Apothic attributes; nothing in the pack grants them, and the
    #                   datapack remaps any that appear onto attributeslib:*
    #   obscure_api:*, merged onto Apothic by the attribute_merge mod (Aquamirae's stats)
    #   cataclysm:additional_critical_damage, merged onto attributeslib:crit_damage (x0.01)
    #   additionalentityattributes:*, three of the thirteen duplicate an Apothic stat and are
    #                   merged onto it by the attribute_merge mod at scale 1.0
    #
    # NOT hidden on purpose:
    # obscure_api parry/accuracy/resilience/regeneration/magic_damage/magic_resistance (live,
    # no Apothic counterpart), and gtbcs_spell_lib spell crit stats (spell-only, different stat).
    #
    # The ten remaining additionalentityattributes rows have no Apothic counterpart and stay
    # visible. Three of them carry real values: generic.water_speed (Origins Merling),
    # player.bonus_rare_loot_rolls and player.bonus_loot_count_rolls (Medieval Origins Goblin).
    # The other seven are registered and functional but nothing in the pack grants them:
    # generic.lava_speed, generic.lung_capacity, generic.jump_height, generic.magic_protection,
    # player.water_visibility, player.lava_visibility, player.collection_range. Add them here if
    # the empty rows are unwanted. generic.jump_height is the only working jump attribute left in
    # the pack.
    S:"Hidden Attributes" <
        forge:nametag_distance
        attributeslib:creative_flight
        attributeslib:elytra_flight
        attributeslib:ghost_health
        irons_lib:crit_damage
        irons_lib:dodge_chance
        irons_lib:armor_pierce
        irons_lib:arrow_damage
        irons_lib:experience_gained
        irons_lib:healing_received
        irons_lib:mining_speed
        obscure_api:critical_damage
        obscure_api:critical_hit
        obscure_api:dodge
        obscure_api:penetration
        obscure_api:healing_power
        cataclysm:additional_critical_damage
        additionalentityattributes:player.critical_bonus_damage
        additionalentityattributes:player.dig_speed
        additionalentityattributes:player.dropped_experience
     >
}


combat_rules {
    # The protection damage reduction formula.
    # Computed after Prot Pierce and Prot Shred are applied.
    # Arguments:
    #     'protPoints' - The number of protection points the user has after reductions.
    # Output:
    #     The percentage of damage taken after protection has been applied, from 0 (no damage taken) to 1 (full damage taken).
    # Reference:
    #     See https://github.com/ezylang/EvalEx#usage-examples for how to write expressions.
    #
    # Default: 1 - min(0.025 * protPoints, 0.85)
    S:"Protection Formula"=1 - min(0.025 * protPoints, 0.85)

    # The a-value formula, which computes an intermediate used in the armor formula.
    # Arguments:
    #     'damage' - The damage of the incoming attack.
    # Output:
    #     The a-value, which will be supplied as an argument to the armor formula.
    # Reference:
    #     See https://github.com/ezylang/EvalEx#usage-examples for how to write expressions.
    #
    # Default: if(damage < 20, 10, 10 + (damage - 20) / 2)
    S:"A-Value Formula"=if(damage < 20, 10, 10 + (damage - 20) / 2)

    # The armor damage reduction formula.
    # Computed after Armor Pierce and Armor Shred are applied.
    # Arguments:
    #     'a' - The a-value computed by the a-value formula.
    #     'damage' - The damage of the incoming attack.
    #     'armor' - The armor value of the user after reductions.
    #     'toughness' - The armor toughness value of the user.
    # Output:
    #     The percentage of damage taken after armor has been applied, from 0 (no damage taken) to 1 (full damage taken).
    # Reference:
    #     See https://github.com/ezylang/EvalEx#usage-examples for how to write expressions.
    # Note:
    #     The vanilla formula is: 1 - min(max(armor - damage / (2 + toughness / 4), armor / 5), 20) / 25
    #
    # Default: a / (a + armor)
    S:"Armor Formula"=a / (a + armor)
}


